[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livetx"
version = "0.1.0"
description = "Transcrição ao vivo do áudio de streams de vídeo para arquivos de log"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.1", "numpy"]

[project.scripts]
livetx = "livetx.__main__:main"
