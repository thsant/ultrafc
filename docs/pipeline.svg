<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 610" width="1060" height="610" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do ultrafc</title>
  <desc id="desc">Quatro processos: pixi run tx transcreve a live e identifica os falantes, gravando o log; pixi run check detecta afirmações no log e as checa na web; pixi run publish envia checagens e resumos para revisão do operador e publica no canal do Telegram; pixi run saber recebe URLs de matérias e de checagens de agências, lê cada página (ou o texto colado pelo operador), liga ao que foi dito na transcrição e envia um card para revisão num segundo bot, que publica no mesmo canal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .lane { font-size: 14px; font-weight: 700; fill: #8b949e; }
      .lane-sub { font-size: 12px; fill: #8b949e; }
      .t { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .s { font-size: 11.5px; text-anchor: middle; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { fill: none; stroke: #8b949e; stroke-width: 1.8; marker-end: url(#arrow); }
      .feed { fill: none; stroke: #8b949e; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .tx rect { fill: #dbeafe; stroke: #2563eb; } .tx text { fill: #1e3a8a; }
      .ck rect { fill: #ffedd5; stroke: #ea580c; } .ck text { fill: #7c2d12; }
      .pb rect { fill: #dcfce7; stroke: #16a34a; } .pb text { fill: #14532d; }
      .sb rect { fill: #ccfbf1; stroke: #0d9488; } .sb text { fill: #134e4a; }
      .tg rect { fill: #e0f2fe; stroke: #0284c7; } .tg text { fill: #0c4a6e; }
      .file rect { fill: #f6f8fa; stroke: #8b949e; } .file text { fill: #24292f; }
      rect { stroke-width: 1.5; }
    </style>
  </defs>

  <!-- rótulos das faixas -->
  <text class="lane" x="16" y="100">pixi run tx</text>
  <text class="lane-sub" x="16" y="118">transcrição e falantes</text>
  <text class="lane" x="16" y="250">pixi run check</text>
  <text class="lane-sub" x="16" y="268">checagem de fatos</text>
  <text class="lane" x="16" y="400">pixi run publish</text>
  <text class="lane-sub" x="16" y="418">publicação</text>
  <text class="lane" x="16" y="550">pixi run saber</text>
  <text class="lane-sub" x="16" y="568">matérias e checagens</text>

  <!-- operador informa os nomes -->
  <g class="file">
    <rect x="665" y="8" width="160" height="36" rx="6"/>
    <text class="t mono" x="745" y="25" style="font-size:12.5px">people.txt</text>
    <text class="s" x="745" y="39">P1:Eduardo Oinegue</text>
  </g>
  <path class="feed" d="M745,44 V74"/>

  <!-- faixa 1: transcrição -->
  <g class="tx">
    <rect x="160" y="76" width="140" height="58" rx="8"/>
    <text class="t" x="230" y="100">URL da live</text>
    <text class="s" x="230" y="119">YouTube · Instagram</text>
  </g>
  <g class="tx">
    <rect x="330" y="76" width="140" height="58" rx="8"/>
    <text class="t" x="400" y="100">yt-dlp + ffmpeg</text>
    <text class="s" x="400" y="119">áudio 16 kHz</text>
  </g>
  <g class="tx">
    <rect x="500" y="76" width="140" height="58" rx="8"/>
    <text class="t" x="570" y="100">VAD (Silero)</text>
    <text class="s" x="570" y="119">segmentos de fala</text>
  </g>
  <g class="tx">
    <rect x="665" y="76" width="160" height="58" rx="8"/>
    <text class="t" x="745" y="100">Whisper + falantes</text>
    <text class="s" x="745" y="119">faster-whisper · CAM++</text>
  </g>
  <g class="file">
    <rect x="855" y="76" width="190" height="58" rx="6"/>
    <text class="t mono" x="950" y="100" style="font-size:12.5px">logs/&lt;stream&gt;/*.log</text>
    <text class="s" x="950" y="119">[hora] Falante: texto</text>
  </g>
  <path class="flow" d="M300,105 H328"/>
  <path class="flow" d="M470,105 H498"/>
  <path class="flow" d="M640,105 H663"/>
  <path class="flow" d="M825,105 H853"/>

  <!-- o log alimenta a detecção e os resumos -->
  <path class="flow" d="M950,134 V178 H400 V224"/>
  <path class="flow" d="M400,178 H305 V405 H328"/>

  <!-- faixa 2: checagem -->
  <g class="ck">
    <rect x="330" y="226" width="140" height="58" rx="8"/>
    <text class="t" x="400" y="250">Detecção</text>
    <text class="s" x="400" y="269">Sonnet 5.5 · raciocínio</text>
  </g>
  <g class="file">
    <rect x="500" y="226" width="140" height="58" rx="6"/>
    <text class="t mono" x="570" y="250" style="font-size:12.5px">to_check/*.md</text>
    <text class="s" x="570" y="269">afirmação + motivo</text>
  </g>
  <g class="ck">
    <rect x="665" y="226" width="160" height="58" rx="8"/>
    <text class="t" x="745" y="250">Checagem ×3</text>
    <text class="s" x="745" y="269">Haiku checa · Opus revisa</text>
  </g>
  <g class="file">
    <rect x="855" y="226" width="190" height="58" rx="6"/>
    <text class="t mono" x="950" y="250" style="font-size:12.5px">checked/*.md</text>
    <text class="s" x="950" y="269">resultado · justificativa · fontes</text>
  </g>
  <path class="flow" d="M470,255 H498"/>
  <path class="flow" d="M640,255 H663"/>
  <path class="flow" d="M825,255 H853"/>

  <!-- faixa 3: publicação -->
  <g class="pb">
    <rect x="330" y="376" width="175" height="58" rx="8"/>
    <text class="t" x="417" y="400">Resumos</text>
    <text class="s" x="417" y="419">Sonnet 5.5 · a cada 10 min</text>
  </g>
  <g class="pb">
    <rect x="580" y="376" width="190" height="58" rx="8"/>
    <text class="t" x="675" y="400">Revisão do operador</text>
    <text class="s" x="675" y="419">✅ Publicar · ❌ Descartar</text>
  </g>
  <g class="tg">
    <rect x="855" y="376" width="190" height="58" rx="8"/>
    <text class="t" x="950" y="400">Canal do Telegram</text>
    <text class="s" x="950" y="419">só o que foi aprovado</text>
  </g>
  <path class="flow" d="M950,284 V330 H675 V374"/>
  <path class="flow" d="M505,405 H578"/>
  <path class="flow" d="M770,405 H853"/>

  <!-- faixa 4: Procure saber! (o log também alimenta a análise) -->
  <path class="flow" d="M305,405 V496 H745 V524"/>
  <g class="sb">
    <rect x="330" y="526" width="140" height="58" rx="8"/>
    <text class="t" x="400" y="550">URL do operador</text>
    <text class="s" x="400" y="569">matéria ou checagem?</text>
  </g>
  <g class="sb">
    <rect x="500" y="526" width="140" height="58" rx="8"/>
    <text class="t" x="570" y="550">Leitura</text>
    <text class="s" x="570" y="569">Haiku · ou texto colado</text>
  </g>
  <g class="sb">
    <rect x="665" y="526" width="160" height="58" rx="8"/>
    <text class="t" x="745" y="550">Análise</text>
    <text class="s" x="745" y="569">Sonnet 5.5 · falas do log</text>
  </g>
  <g class="sb">
    <rect x="855" y="526" width="190" height="58" rx="8"/>
    <text class="t" x="950" y="550">Revisão (2º bot)</text>
    <text class="s" x="950" y="569">card + texto · ✅ · ❌</text>
  </g>
  <path class="flow" d="M470,555 H498"/>
  <path class="flow" d="M640,555 H663"/>
  <path class="flow" d="M825,555 H853"/>
  <path class="flow" d="M950,526 V436"/>
</svg>
