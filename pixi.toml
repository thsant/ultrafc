[workspace]
name = "ultrafc"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12" }]

[dependencies]
python = "3.12.*"
ffmpeg = "*"
yt-dlp = "*"
numpy = "*"
pytest = "*"
rich = "*"
rich-argparse = "*"
anthropic = "*"
pydantic = "*"
python-telegram-bot = "*"
cuda-version = "12.*"
cudnn = "9.*"
libcublas = "*"

[pypi-dependencies]
faster-whisper = ">=1.1"
streamlink = "*"
sherpa-onnx = "*"
ultrafc = { path = ".", editable = true }

[tasks]
tx = "python -m ultrafc"
test = "pytest -q tests"
check = "python -m ultrafc.factcheck"
publish = "python -m ultrafc.publish"
check-cuda = "python -c 'import ctranslate2; print(ctranslate2.get_cuda_device_count())'"
